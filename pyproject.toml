[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytemplate"
version = "0.1.0"
description = "前后端项目初始化模板生成器(simple / complex 两种模式)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
pytemplate = "pytemplate.cli:main"

[tool.setuptools.packages.find]
include = ["pytemplate*"]

[tool.setuptools.package-data]
pytemplate = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pytemplate --cov-report=term-missing --cov-fail-under=75"
